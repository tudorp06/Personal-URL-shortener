<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tudor Builds URL Shortener</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://cdn.jsdelivr.net/npm/@fontsource/mona-sans@5/index.css" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f4;
    --card: #ffffff;
    --text: #0a0a0a;
    --muted: #737373;
    --accent: #0a0a0a;
    --border: #e7e5e4;
    --error: #dc2626;
    --success: #16a34a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Mona Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    line-height: 1.5;
  }

  .container {
    width: 100%;
    max-width: 620px;
    text-align: center;
  }

  h1 {
    font-size: clamp(1.7rem, 4.5vw, 2.4rem);
    font-weight: 800;
    letter-spacing: -0.04em;
    line-height: 1.05;
    margin-bottom: 44px;
  }

  .card {
    background: rgba(255, 255, 255, 0.75);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 24px;
    box-shadow: 0 8px 40px rgba(0, 0, 0, 0.05);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }

  form { display: flex; gap: 10px; }

  input[type="url"] {
    flex: 1;
    min-width: 0;
    padding: 16px 18px;
    font-size: 1rem;
    border: 1px solid var(--border);
    border-radius: 12px;
    outline: none;
    background: #fff;
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  input[type="url"]:focus {
    border-color: var(--text);
    box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.08);
  }

  .msg {
    display: none;
    font-size: 0.9rem;
    margin-top: 16px;
    padding: 10px 14px;
    border-radius: 10px;
    text-align: left;
  }
  .msg.show { display: block; }
  .msg.error { background: #fef2f2; color: var(--error); border: 1px solid #fecaca; }
  .msg.success { background: #f0fdf4; color: var(--success); border: 1px solid #bbf7d0; }

  .result-row {
    display: none;
    align-items: center;
    gap: 10px;
    margin-top: 18px;
    text-align: left;
  }
  .result-row.show { display: flex; }

  .result-row .link {
    flex: 1;
    min-width: 0;
    padding: 13px 16px;
    background: #fff;
    border: 1px dashed var(--border);
    border-radius: 10px;
    font-size: 0.95rem;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .copy-btn {
    padding: 13px 18px;
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--accent);
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    white-space: nowrap;
  }
  .copy-btn:hover { background: #f5f5f5; border-color: var(--text); }
  .copy-btn:active { transform: translateY(1px); }

  footer {
    margin-top: 32px;
    display: flex;
    justify-content: center;
  }

  .profile-card {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 9px 18px 9px 9px;
    background: rgba(255, 255, 255, 0.75);
    border: 1px solid var(--border);
    border-radius: 999px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    text-align: left;
  }

  .profile-card .pfp {
    flex-shrink: 0;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    overflow: hidden;
    border: 2px solid var(--text);
    background: #fff;
  }

  .profile-card .pfp img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .profile-info {
    display: flex;
    flex-direction: column;
    line-height: 1.3;
  }

  .profile-info .handle {
    font-weight: 600;
    font-size: 0.875rem;
    color: var(--text);
    text-decoration: none;
  }
  .profile-info .handle:hover { text-decoration: underline; }

  .profile-info .say-hi {
    font-size: 0.75rem;
    color: var(--muted);
    text-decoration: none;
  }
  .profile-info .say-hi:hover { text-decoration: underline; }

  /* ---- React Bits SpecularButton ---- */
  .specular-button {
    --sb-radius: 14px;
    --sb-tint: #0d0d0d;
    --sb-tint-opacity: 0.85;
    --sb-blur: 12px;
    --sb-text-color: #fafafa;

    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: none;
    margin: 0;
    font-family: inherit;
    font-weight: 600;
    letter-spacing: 0.01em;
    line-height: 1;
    color: var(--sb-text-color);
    background:
      linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0)),
      color-mix(in srgb, var(--sb-tint) calc(var(--sb-tint-opacity) * 100%), transparent);
    border-radius: var(--sb-radius);
    backdrop-filter: blur(var(--sb-blur));
    -webkit-backdrop-filter: blur(var(--sb-blur));
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.10),
      0 8px 24px rgba(0, 0, 0, 0.28);
    cursor: pointer;
    outline: none;
    transition: transform 0.15s ease;
  }

  .specular-button:active { transform: scale(0.97); }

  .specular-button:focus-visible {
    outline: 2px solid color-mix(in srgb, var(--sb-text-color) 60%, transparent);
    outline-offset: 3px;
  }

  .specular-button:disabled { opacity: 0.6; cursor: default; }
  .specular-button:disabled:active { transform: none; }

  .specular-button--lg {
    font-size: 1rem;
    padding: 16px 26px;
  }

  .specular-button--sm {
    font-size: 0.85rem;
    padding: 10px 22px;
  }

  .specular-button__fx {
    position: absolute;
    inset: -20px;
    pointer-events: none;
    z-index: 1;
  }

  .specular-button__fx canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  .specular-button__label {
    position: relative;
    z-index: 2;
  }
</style>
</head>
<body>

  <div class="container">
    <h1>Tudor Builds URL Shortener</h1>

    <div class="card">
      <form id="shortenForm" novalidate>
        <input type="url" id="longUrl" name="url" placeholder="https://example.com/some/very/long/path" required autocomplete="off">
        <button type="submit" id="shortenBtn" class="specular-button specular-button--lg">
          <span class="specular-button__fx" aria-hidden="true"></span>
          <span class="specular-button__label">Shorten</span>
        </button>
      </form>

      <div class="msg error" id="errorMsg"></div>
      <div class="msg success" id="successMsg"></div>

      <div class="result-row" id="resultRow">
        <span class="link" id="shortLink"></span>
        <button type="button" class="copy-btn" id="copyBtn">Copy</button>
      </div>
    </div>

    <footer>
      <div class="profile-card">
        <a class="pfp" href="https://x.com/tudorxjh" target="_blank" rel="noopener" aria-label="@tudorbuildsai on X">
          <img src="https://unavatar.io/x/tudorxjh" alt="@tudorbuildsai" width="40" height="40" loading="lazy">
        </a>
        <div class="profile-info">
          <a class="handle" href="https://x.com/tudorxjh" target="_blank" rel="noopener">@tudorbuildsai</a>
          <a class="say-hi" href="mailto:hello@tudor.dev">Say hi</a>
        </div>
      </div>
    </footer>
  </div>

<script type="module">
  import { Renderer, Program, Mesh, Triangle, Color } from 'https://cdn.jsdelivr.net/npm/ogl/+esm';

  const PAD = 20;

  const VERT = `#version 300 es
in vec2 position;
void main() {
  gl_Position = vec4(position, 0.0, 1.0);
}
`;

  const FRAG = `#version 300 es
precision highp float;

uniform vec2 uCenter;
uniform vec2 uHalfSize;
uniform float uRadius;
uniform float uAngle;
uniform float uPx;
uniform vec3 uLineColor;
uniform vec3 uBaseColor;
uniform float uIntensity;
uniform float uShineSize;
uniform float uShineFade;
uniform float uThickness;
uniform float uBaseWidth;

out vec4 fragColor;

float sdRoundedRect(vec2 p, vec2 b, float r) {
  vec2 q = abs(p) - b + r;
  return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r;
}

float shapeSDF(vec2 p) { return sdRoundedRect(p, uHalfSize, uRadius); }

float gaussianLine(float d, float sigma) {
  float x = d / (sigma + 1e-6);
  float k = mix(1.0, 1.6, smoothstep(0.0, 1.5, x));
  return exp(-k * x * x);
}

void main() {
  vec2 p = gl_FragCoord.xy - uCenter;
  float d = shapeSDF(p);
  vec2 L = vec2(cos(uAngle), sin(uAngle));

  float base = (1.0 - smoothstep(0.0, uBaseWidth, abs(d))) * 0.45;

  vec2 nEll = normalize(p / (uHalfSize * uHalfSize) + 1e-6);
  float phi = acos(clamp(abs(dot(nEll, L)), 0.0, 1.0));
  float rim = 1.0 - smoothstep(uShineSize - uShineFade, uShineSize + uShineFade + 1e-4, phi);
  float line = gaussianLine(d, uThickness);
  float edgeClamp = 1.0 - smoothstep(0.5 * uPx, 3.0 * uPx, abs(d));
  float hi = line * rim * edgeClamp * uIntensity;

  vec3 col = uBaseColor * base + uLineColor * hi;
  float a = clamp(base + hi, 0.0, 1.0);
  fragColor = vec4(col, a);
}
`;

  function initSpecularButton(btn, fx) {
    const dpr = window.devicePixelRatio || 1;
    const renderer = new Renderer({ alpha: true, premultipliedAlpha: true, antialias: true, dpr });
    const gl = renderer.gl;
    gl.clearColor(0, 0, 0, 0);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);

    const geometry = new Triangle(gl);
    if (geometry.attributes.uv) delete geometry.attributes.uv;

    const props = {
      radius: 14,
      lineColor: '#ffffff',
      baseColor: '#9d9d9d',
      intensity: 1.3,
      shineSize: 12,
      shineFade: 40,
      thickness: 2,
      speed: 0.4,
      followMouse: true,
      proximity: 260,
      autoAnimate: true
    };

    const program = new Program(gl, {
      vertex: VERT,
      fragment: FRAG,
      uniforms: {
        uCenter: { value: [0, 0] },
        uHalfSize: { value: [1, 1] },
        uRadius: { value: 0 },
        uAngle: { value: 2.4 },
        uPx: { value: dpr },
        uLineColor: { value: [1, 1, 1] },
        uBaseColor: { value: [0.32, 0.32, 0.32] },
        uIntensity: { value: 1 },
        uShineSize: { value: 0.17 },
        uShineFade: { value: 0.7 },
        uThickness: { value: 1 },
        uBaseWidth: { value: dpr }
      }
    });

    const mesh = new Mesh(gl, { geometry, program });
    fx.appendChild(gl.canvas);

    const sizeRef = { w: 1, h: 1 };
    const resize = () => {
      const rect = btn.getBoundingClientRect();
      const w = rect.width;
      const h = rect.height;
      sizeRef.w = w;
      sizeRef.h = h;
      renderer.setSize(w + PAD * 2, h + PAD * 2);
      program.uniforms.uCenter.value = [(PAD + w / 2) * dpr, (PAD + h / 2) * dpr];
      program.uniforms.uHalfSize.value = [(w / 2) * dpr, (h / 2) * dpr];
    };
    const ro = new ResizeObserver(resize);
    ro.observe(btn);
    resize();

    let pointerAngle = null;
    let proximityT = 0;
    const onPointerMove = e => {
      const rect = btn.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const dx = Math.max(rect.left - e.clientX, 0, e.clientX - rect.right);
      const dy = Math.max(rect.top - e.clientY, 0, e.clientY - rect.bottom);
      const dist = Math.hypot(dx, dy);
      pointerAngle = Math.atan2(cy - e.clientY, e.clientX - cx);
      const t = Math.max(0, 1 - dist / Math.max(props.proximity, 1));
      proximityT = t * t * (3 - 2 * t);
    };
    window.addEventListener('pointermove', onPointerMove);

    let angle = 2.4;
    let idleAngle = 2.4;
    let smoothPointer = 2.4;
    let steerT = 0;
    let bright = 0;
    let last = performance.now();
    let raf = 0;

    const wrapDelta = a => ((a + Math.PI * 3) % (Math.PI * 2)) - Math.PI;

    const lineC = new Color();
    const baseC = new Color();

    const update = now => {
      raf = requestAnimationFrame(update);
      const dt = Math.min((now - last) / 1000, 0.05);
      last = now;
      const p = props;

      idleAngle += p.speed * dt;

      if (pointerAngle != null) {
        smoothPointer += wrapDelta(pointerAngle - smoothPointer) * (1 - Math.exp(-dt * 5));
      }
      const steeringActive = p.followMouse && pointerAngle != null;
      steerT += ((steeringActive ? 1 : 0) - steerT) * (1 - Math.exp(-dt * 4));

      const influence = steerT * proximityT * 0.45;
      angle += wrapDelta(idleAngle - angle) * (1 - Math.exp(-dt * 6));
      angle += wrapDelta(smoothPointer - angle) * influence * (1 - Math.exp(-dt * 2.5));

      const brightTarget = p.autoAnimate ? 1 : proximityT;
      bright += (brightTarget - bright) * (1 - Math.exp(-dt * 8));

      lineC.set(p.lineColor);
      baseC.set(p.baseColor);
      program.uniforms.uAngle.value = angle;
      program.uniforms.uRadius.value = Math.min(p.radius, Math.min(sizeRef.w, sizeRef.h) / 2) * dpr;
      program.uniforms.uLineColor.value = [lineC.r, lineC.g, lineC.b];
      program.uniforms.uBaseColor.value = [baseC.r, baseC.g, baseC.b];
      program.uniforms.uIntensity.value = p.intensity * bright;
      program.uniforms.uShineSize.value = (p.shineSize * Math.PI) / 180;
      program.uniforms.uShineFade.value = (p.shineFade * Math.PI) / 180;
      program.uniforms.uThickness.value = p.thickness * dpr;
      renderer.render({ scene: mesh });
    };
    raf = requestAnimationFrame(update);

    return () => {
      cancelAnimationFrame(raf);
      ro.disconnect();
      window.removeEventListener('pointermove', onPointerMove);
      if (gl.canvas.parentNode === fx) fx.removeChild(gl.canvas);
      gl.getExtension('WEBGL_lose_context')?.loseContext();
    };
  }

  /* ---- form wiring ---- */
  const form = document.getElementById("shortenForm");
  const input = document.getElementById("longUrl");
  const btn = document.getElementById("shortenBtn");
  const fx = btn.querySelector(".specular-button__fx");
  const errorMsg = document.getElementById("errorMsg");
  const successMsg = document.getElementById("successMsg");
  const resultRow = document.getElementById("resultRow");
  const shortLink = document.getElementById("shortLink");
  const copyBtn = document.getElementById("copyBtn");

  initSpecularButton(btn, fx);

  function showMsg(el, text) {
    [errorMsg, successMsg].forEach(m => m.classList.remove("show"));
    el.textContent = text;
    el.classList.add("show");
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const url = input.value.trim();
    if (!url) return;

    const label = btn.querySelector(".specular-button__label");
    btn.disabled = true;
    label.textContent = "Shortening…";
    [errorMsg, successMsg].forEach(m => m.classList.remove("show"));

    try {
      const res = await fetch("/api/shorten", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url })
      });

      const data = await res.json();

      if (!res.ok) {
        showMsg(errorMsg, data.error || "Something went wrong. Try again.");
        return;
      }

      shortLink.textContent = data.short;
      resultRow.classList.add("show");
      showMsg(successMsg, "Short link ready!");
      input.value = "";
      copyBtn.focus();
    } catch (err) {
      showMsg(errorMsg, "Network error — is the server running?");
    } finally {
      btn.disabled = false;
      label.textContent = "Shorten";
    }
  });

  copyBtn.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(shortLink.textContent);
      showMsg(successMsg, "Copied to clipboard!");
    } catch {
      showMsg(errorMsg, "Copy failed — select the link manually.");
    }
  });
</script>

</body>
</html>
